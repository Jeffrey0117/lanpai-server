<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>懶拍 Overlay</title>
<meta name="description" content="把文字和圖片直接釘在螢幕上。沒有視窗,沒有背景,沒有廢話。">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main class="page">
  <header class="hero">
    <h1>懶拍 Overlay</h1>
    <p>把文字和圖片直接釘在螢幕上。沒有視窗,沒有背景,沒有廢話。</p>
    <a class="primary" href="https://github.com/Jeffrey0117/lanpai-overlay/releases/latest">下載 Windows 版</a>
  </header>
  <section class="plans">
    <div class="plan">
      <h2>免費</h2>
      <p class="price">NT$0</p>
      <ul>
        <li>同時釘 5 個</li>
        <li>樣式模板 1 組</li>
        <li>選取組 1 組</li>
        <li>便籤板 1 個</li>
      </ul>
    </div>
    <div class="plan pro">
      <h2>Pro</h2>
      <p class="price">NT$99<small> / 月</small></p>
      <ul>
        <li>同時釘不限</li>
        <li>樣式模板 6 組</li>
        <li>選取組 7 組</li>
        <li>便籤板不限</li>
      </ul>
    </div>
  </section>
</main>
</body>
</html>
